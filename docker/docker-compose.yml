services:
  readtheroad-db:
    image: mysql:8.0
    container_name: readtheroad-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: speedotector

    ports:
      - "3307:3306"

    volumes:
      - readtheroad_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: readtheroad-app:latest
    container_name: readtheroad-app
    restart: "no"

    ports:
      - "8000:8000"

    env_file:
      - ../.env


    environment:
      PYTHONPATH: /app
      DB_HOST: readtheroad-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 12345
      DB_NAME: speedotector
      VIDEO_PATH: /app/test_video.mp4
      MODEL_PATH: /app/models/license_plate.pt
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      YOLO_CONFIG_DIR: /tmp/Ultralytics

    depends_on:
      readtheroad-db:
        condition: service_healthy

    volumes:
      - ../ingestion:/app/ingestion
      - ../ocr:/app/ocr
      - ../db:/app/db
      - ../src:/app/src
      - ../models:/app/models:ro
      - ../main.py:/app/main.py:ro
      - ../test_video.mp4:/app/test_video.mp4:ro
      - ../outputs:/app/outputs

    command: ["uvicorn", "src.main_api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  readtheroad_mysql_data: